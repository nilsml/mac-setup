# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Personlig OpenCode og shell

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - data.norges-bank.no:443
          - api.berget.ai:443
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: [sh, /opt/personal/install.sh]
          user: "1000"
          description: Installer personlige standardinnstillinger uten å overskrive eksisterende filer
